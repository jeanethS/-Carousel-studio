theme:
  backgroundColor: "#0a0a0c"   # color de fondo principal del template
  accentColor: "#f5f4f0"       # color de acento (CTAs, números, highlights)
  textColor: "#f2f1ed"         # color del texto principal (headline)
  mutedTextColor: "#b8b6b0"    # color del texto secundario (body/footer)

overlayOpacity: 0.35

fallbackGradients:
  - "linear-gradient(135deg, #0a0a0c 0%, #1c1c22 50%, #2e2e38 100%)"
  - "linear-gradient(135deg, #050506 0%, #16161c 50%, #f5f4f0 100%)"
  - "radial-gradient(circle at 50% 45%, #f5f4f0 0%, #4a4a52 25%, #16161c 55%, #050506 100%)"

fontFamily: "Century Gothic, system-ui, -apple-system, sans-serif"

slide:
  width: 1200
  height: 1200
  padding: 90

typography:
  headline:
    fontSize: 46
    fontWeight: 600
    lineHeight: 1.2
    color: "#f2f1ed"
  bodyText:
    fontSize: 14
    fontWeight: 400
    lineHeight: 1.4
    color: "#b8b6b0"
  dataPoint:
    fontSize: 64
    fontWeight: 800
    lineHeight: 1.1
    color: "#f5f4f0"
  visualCue:
    fontSize: 16
    fontWeight: 600
    lineHeight: 1.3
    color: "#d9d7d0"
  footer:
    fontSize: 12
    fontWeight: 400
    color: "#a8a6a0"
