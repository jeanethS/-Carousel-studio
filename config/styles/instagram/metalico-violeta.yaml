theme:
  backgroundColor: "#0a0a0a"
  accentColor: "#c9a0f5"
  textColor: "#c9a0f5"
  mutedTextColor: "#f5f5f5"

overlayOpacity: 0

fallbackGradients:
  - "linear-gradient(135deg, #1a1a1a 0%, #8a8a8a 50%, #e8e8e8 100%)"
  - "linear-gradient(135deg, #050505 0%, #6b6b6b 45%, #d4d4d4 75%, #ffffff 100%)"

fontFamily: "Bodoni Moda, Playfair Display, Georgia, serif"

slide:
  width: 1200
  height: 1200
  padding: 64

typography:
  headline:
    fontSize: 88
    fontWeight: 700
    lineHeight: 1.0
    color: "#c9a0f5"
  bodyText:
    fontSize: 22
    fontWeight: 400
    lineHeight: 1.3
    color: "#f5f5f5"
  dataPoint:
    fontSize: 96
    fontWeight: 800
    lineHeight: 1.0
    color: "#c9a0f5"
  visualCue:
    fontSize: 20
    fontWeight: 600
    lineHeight: 1.2
    color: "#f5f5f5"
  footer:
    fontSize: 18
    fontWeight: 400
    color: "#f5f5f5"

# NOTA: template original tenía un anillo/nudo cromado 3D como elemento
# gráfico central dominante. El renderer actual (InstagramSlide) no
# soporta gráficos superpuestos, solo foto de fondo o gradiente — este
# archivo solo captura fondo/tipografía.
