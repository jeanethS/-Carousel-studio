theme:
  backgroundColor: "#1a140f"
  accentColor: "#d4a24e"
  textColor: "#f2e9d8"
  mutedTextColor: "#c9bfa8"

overlayOpacity: 0.35

fallbackGradients:
  - "linear-gradient(135deg, #1a140f 0%, #3a2c1e 50%, #5c4530 100%)"
  - "linear-gradient(135deg, #14100c 0%, #2e2016 50%, #4a3624 100%)"

fontFamily: "Poppins, system-ui, -apple-system, sans-serif"

slide:
  width: 1200
  height: 1200
  padding: 64

typography:
  headline:
    fontSize: 52
    fontWeight: 400
    lineHeight: 1.2
    color: "#f2e9d8"
  bodyText:
    fontSize: 24
    fontWeight: 400
    lineHeight: 1.4
    color: "#e3d8c2"
  dataPoint:
    fontSize: 88
    fontWeight: 800
    lineHeight: 1.1
    color: "#d4a24e"
  visualCue:
    fontSize: 20
    fontWeight: 600
    lineHeight: 1.3
    color: "#f2e9d8"
  footer:
    fontSize: 16
    fontWeight: 400
    color: "#c9bfa8"
