# Instagram Design Tokens
# Used by src/templates/instagram/slide.tsx for slide rendering

theme:
  backgroundColor: "#1a1a2e"
  accentColor: "#e94560"
  textColor: "#ffffff"
  mutedTextColor: "#b0b0c0"

overlayOpacity: 0.35

fallbackGradients:
  - "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)"
  - "linear-gradient(135deg, #2d1b69 0%, #1a1a2e 50%, #0f3460 100%)"
  - "linear-gradient(135deg, #e94560 0%, #533483 50%, #0f3460 100%)"

fontFamily: "Inter, system-ui, -apple-system, sans-serif"

slide:
  width: 1200
  height: 1200
  padding: 48

typography:
  headline:
    fontSize: 64
    fontWeight: 700
    lineHeight: 1.2
    color: "#ffffff"
  bodyText:
    fontSize: 32
    fontWeight: 400
    lineHeight: 1.5
    color: "#b0b0c0"
  dataPoint:
    fontSize: 80
    fontWeight: 800
    lineHeight: 1.1
    color: "#e94560"
  visualCue:
    fontSize: 24
    fontWeight: 600
    lineHeight: 1.3
    color: "#e94560"
  footer:
    fontSize: 20
    fontWeight: 400
    color: "#666680"
