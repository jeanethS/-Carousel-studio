# LinkedIn Design Tokens
# Used by src/templates/linkedin/slide.tsx for slide rendering

theme:
  backgroundColor: "#ffffff"
  accentColor: "#0a66c2"
  textColor: "#1d2226"
  mutedTextColor: "#666666"

overlayOpacity: 0

fontFamily: "Segoe UI, system-ui, -apple-system, sans-serif"

slide:
  width: 1200
  height: 627
  padding: 48

typography:
  headline:
    fontSize: 48
    fontWeight: 700
    lineHeight: 1.2
    color: "#1d2226"
  bodyText:
    fontSize: 24
    fontWeight: 400
    lineHeight: 1.5
    color: "#666666"
  dataPoint:
    fontSize: 64
    fontWeight: 800
    lineHeight: 1.1
    color: "#0a66c2"
  visualCue:
    fontSize: 20
    fontWeight: 600
    lineHeight: 1.3
    color: "#0a66c2"
  footer:
    fontSize: 16
    fontWeight: 400
    color: "#666666"
